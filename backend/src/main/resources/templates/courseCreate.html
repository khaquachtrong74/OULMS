<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>

    <main class="main-content bg-light min-vh-100 p-4">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="h3 fw-bold mb-0">
                <span th:text="${course.id == null ? 'Thêm khóa học mới' : 'Cập nhật khóa học'}"></span>
            </h1>
            <a th:href="@{/admin/courses}" class="btn btn-outline-secondary rounded-pill px-4 shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Quay lại danh sách
            </a>
        </header>

        <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
            <form method="post" th:object="${course}" th:action="@{/admin/course}">

                <div class="row">
                    <div class="col-md-8 mb-4">
                        <label for="name" class="form-label fw-semibold text-muted">Tên khóa học <span class="text-danger">*</span>:</label>
                        <input type="text" 
                               class="form-control rounded-3" 
                               id="name" 
                               placeholder="Nhập tên khóa học" 
                               th:field="*{name}" 
                               required maxlength="50"/>
                    </div>

                    <div class="col-md-4 mb-4">
                        <label for="price" class="form-label fw-semibold text-muted">Mức giá (VNĐ) <span class="text-danger">*</span>:</label>
                        <input type="number" 
                               class="form-control rounded-3" 
                               th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                               id="price" 
                               min="0"
                               placeholder="VD: 500000" 
                               th:field="*{price}" 
                               onkeydown="return event.keyCode !== 69 && event.keyCode !== 189 && event.keyCode !== 109"
                               oninput="this.value = Math.abs(this.value)"
                               required />

                        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">
                            Giá tiền không hợp lệ.
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="subjectId" class="form-label fw-semibold text-muted">Thuộc môn học:</label>
                        <select class="form-select rounded-3" th:field="*{subjectId}" id="subjectId">
                            <option value="">-- Chọn môn học --</option>
                            <option th:each="s : ${subjects}" 
                                    th:value="${s.id}" 
                                    th:text="${s.name}"></option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label for="lecturerId" class="form-label fw-semibold text-muted">Giảng viên phụ trách:</label>
                        <select class="form-select rounded-3" th:field="*{lecturerId}" id="lecturerId">
                            <option value="">-- Chọn giảng viên --</option>
                            <option th:each="l : ${lecturers}" 
                                    th:value="${l.id}" 
                                    th:text="${l.lastName + ' ' + l.firstName + ' (' + l.email + ')'}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold text-muted">Mô tả tóm tắt (Tối đa 100 ký tự):</label>
                    <textarea class="form-control rounded-3" 
                              id="description" 
                              rows="3" 
                              placeholder="Nhập thông tin mô tả..." 
                              th:field="*{description}"
                              maxlength="100"></textarea>
                </div>

                <div class="d-flex gap-2 pt-3 border-top">
                    <button th:if="${course.id == null}" class="btn btn-primary px-4 rounded-pill shadow-sm">
                        <i class="bi bi-plus-circle me-2"></i>Thêm khóa học
                    </button>

                    <button th:unless="${course.id == null}" class="btn btn-success px-4 rounded-pill shadow-sm">
                        <i class="bi bi-save me-2"></i>Lưu thay đổi
                    </button>

                    <a th:href="@{/admin/courses}" class="btn btn-light px-4 rounded-pill shadow-sm">
                        Hủy bỏ
                    </a>
                </div>

            </form>
        </div>
    </main>

    <script th:src="@{/js/script.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
