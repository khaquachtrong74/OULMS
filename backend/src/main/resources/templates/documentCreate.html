<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="h3 fw-bold mb-0">Thêm tài liệu</h1>
        </header>
        
        <div>
            <form method="post" th:object="${document}" th:action="@{/admin/document}" enctype="multipart/form-data">
              <div class="mb-3 mt-3">
                  <label for="title" class="form-label">Title:</label>
                  <input type="text" class="form-control" id="title" placeholder="Tên tài liệu" th:field="*{title}" />
              </div>

              <div class="mb-3">
                  <label for="description" class="form-label">Description:</label>
                  <textarea class="form-control" id="description" rows="3" placeholder="Miêu tả" th:field="*{description}"></textarea>
              </div>

              <div class="mb-3">
                  <label for="topic" class="form-label">Thuộc chủ đề:</label>
                  <select class="form-select" th:field="*{topicId}" id="topic">
                      <option value="">-- Chọn chủ đề --</option>
                      <option th:each="t : ${topics}" th:value="${t.id}" th:text="${t.name}"></option>
                  </select>
              </div>

              <div class="mb-3">
                  <label for="level" class="form-label">Cấp độ:</label>
                  <select class="form-select" th:field="*{levelId}" id="level">
                      <option value="">-- Chọn cấp độ --</option>
                      <option th:each="l : ${levels}" th:value="${l.id}" th:text="${l.name}"></option>
                  </select>
              </div>

              <div class="mb-3">
                  <label for="file" class="form-label">Tải tài liệu lên:</label>
                  <input type="file" class="form-control" th:field="*{file}" id="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.mp4,.jpg,.png" />
                  <div class="form-text">
<<<<<<< HEAD
                      Hỗ trợ: PDF, Word, PowerPoint, Video, ZIP, hình ảnh(Giới hạn 500MB).
=======
                      Hỗ trợ: PDF, Word, PowerPoint, Video, ZIP, hình ảnh.
>>>>>>> develop
                  </div>
              </div>

              <button th:if="${document.id == null}" class="btn btn-success mb-2">
                  Thêm tài liệu
              </button>

              <button th:unless="${document.id == null}" class="btn btn-success mb-2">
                  Cập nhật tài liệu
              </button>

              <input type="hidden" th:field="*{id}" />
          </form>
        </div>
    </main>
</body>
</html>
