<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{index :: head}"></th:block>
</head>
<body>
    <div class="wrapper">
        <aside th:replace="~{index :: sidebar}"></aside>
        
        <main class="main-content p-4 bg-light min-vh-100">
            <header class="mb-4 d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1">Chi tiết học liệu lưu trữ</h2>
                    <div>
                        Trạng thái hiện tại: 
                        <span th:if="${document.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                        <span th:if="${document.status.name() == 'REJECTED'}" class="badge bg-danger">REJECTED</span>
                    </div>
                </div>
                <a th:href="@{/admin/documents}" class="btn btn-outline-secondary rounded-pill">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
            </header>

            <div class="card border-0 shadow-sm p-4 rounded-4">
                <div class="row">
                    <div class="col-md-6">
                        <table class="table table-borderless">
                            <tbody>
                                <tr>
                                    <th scope="row" class="text-muted w-25">Mã ID:</th>
                                    <td class="fw-bold" th:text="${document.id}"></td>
                                </tr>
                                <tr>
                                    <th scope="row" class="text-muted">Tiêu đề:</th>
                                    <td th:text="${document.title}"></td>
                                </tr>
                                <tr>
                                    <th scope="row" class="text-muted">Mô tả:</th>
                                    <td th:text="${document.description}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-6 border-start">
                        <table class="table table-borderless">
                            <tbody>
                                <tr>
                                    <th scope="row" class="text-muted w-25">Chủ đề:</th>
                                    <td th:text="${document.topicId.name}"></td>
                                </tr>
                                <tr>
                                    <th scope="row" class="text-muted">Cấp độ:</th>
                                    <td th:text="${document.levelId.name}"></td>
                                </tr>
                                <tr>
                                    <th scope="row" class="text-muted">Tệp tin:</th>
                                    <td>
                                        <a th:href="${document.fileUrl}" download class="btn btn-sm btn-primary">
                                            <i class="bi bi-download"></i> Tải xuống tệp gốc
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
