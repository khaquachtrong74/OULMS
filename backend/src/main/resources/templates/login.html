<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập - OULMS</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f1f3ff] min-h-screen flex flex-col">

    <!-- Header fragment -->
    <div>
        <header class="bg-white border-b border-gray-200 py-4 px-8 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-[#004aad] rounded-lg flex items-center justify-center">
                    <svg
                        class="w-5 h-5 text-white"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
                        ></path>
                    </svg>
                </div>

                <span class="text-xl font-bold text-[#004aad]">
                    OULMS
                </span>
            </div>

            
        </header>
    </div>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">
                    Chào mừng trở lại
                </h1>

                <p class="text-gray-500">
                    Đăng nhập vào hệ thống EduDocs của bạn
                </p>
            </div>

            <form method="post" th:action="@{/login}" class="space-y-5">

                <!-- Email -->
                <div>
                    <label
                        for="email"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Email
                    </label>

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M16 12H8m0 0l4-4m-4 4l4 4"
                                ></path>
                            </svg>
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="username"
                            placeholder="Nhập email của bạn"
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#004aad] focus:border-[#004aad] transition-all outline-none"
                        >
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label
                            for="password"
                            class="block text-sm font-medium text-gray-700"
                        >
                            Mật khẩu
                        </label>

                        <a
                            href="#"
                            class="text-xs font-semibold text-[#004aad] hover:underline"
                        >
                            Quên mật khẩu?
                        </a>
                    </div>

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                                ></path>
                            </svg>
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Nhập mật khẩu"
                            class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#004aad] focus:border-[#004aad] transition-all outline-none"
                        >

                        <button
                            type="button"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                        >
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                                ></path>

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                ></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="flex items-center">
                    <input
                        id="remember-me"
                        name="remember-me"
                        type="checkbox"
                        class="h-4 w-4 text-[#004aad] focus:ring-[#004aad] border-gray-300 rounded"
                    >

                    <label
                        for="remember-me"
                        class="ml-2 block text-sm text-gray-700"
                    >
                        Ghi nhớ đăng nhập
                    </label>
                </div>

                <!-- Submit -->
                <button
                    class="w-full bg-[#004aad] text-white font-bold py-3 px-4 rounded-xl hover:bg-[#003a8c] transform active:scale-[0.98] transition-all flex justify-center items-center gap-2 group"
                >
                    Đăng nhập

                    <svg
                        class="w-5 h-5 group-hover:translate-x-1 transition-transform"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M13 7l5 5m0 0l-5 5m5-5H6"
                        ></path>
                    </svg>
                </button>
            </form>

            <!-- Register -->
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-sm text-gray-600">
                    Chưa có tài khoản?

                    <a
                        href="#"
                        class="font-bold text-[#004aad] hover:underline"
                        th:action="@{/register}"
                    >
                        Đăng ký tài liệu ngay
                    </a>
                </p>
            </div>
        </div>
    </main>

    </div>-->

</body>
</html>
