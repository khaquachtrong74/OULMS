<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="h3 fw-bold mb-0">Quản lí môn học</h1>
            
            <div class="d-flex gap-3 align-items-center">
                <div class="position-relative">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text"
                           class="form-control ps-5 border-0 bg-white shadow-sm rounded-pill"
                           placeholder="Tìm kiếm..."
                           style="width: 300px;">
                </div>

                <button class="btn btn-white shadow-sm rounded-circle position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
                </button>
            </div>
        </header>
        
        <a th:href="@{/admin/subject/created}" class="btn btn-success">Thêm môn học</a>
        
        <div>
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th scope="col">id</th>
                        <th scope="col">name</th>
                        <th scope="col">Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s: ${subjects}">
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.name}"></td>
                        <td th:text="${s.description}"></td>
                        <td>
                            <a th:href="@{/admin/subject/created/} + ${s.id}" class="btn btn-info">Cập nhật</a>
                            <button class="btn btn-danger" th:onclick="'deleteSubject(\'' + @{/api/subject/} + ${s.id} + '\')'">Xoá</button>
                        </td>
                    </tr>
                </tbody>
          </table>
        </div>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
