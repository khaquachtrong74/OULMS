<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    <main class="main-content bg-light min-vh-100 p-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">
                    <i class="bi bi-book text-primary me-2"></i>
                    Quản lí môn học
                </h1>
                <p class="text-muted mb-0">Danh sách các môn học trong hệ thống</p>
            </div>

            <div class="d-flex gap-3 align-items-center">
                <div class="position-relative">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text"
                           class="form-control ps-5 border-0 bg-white shadow-sm rounded-pill"
                           placeholder="Tìm kiếm môn học..."
                           style="width: 300px;">
                </div>

                <button class="btn btn-light shadow-sm rounded-circle">
                    <i class="bi bi-bell fs-5"></i>
                </button>
            </div>
        </header>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-semibold mb-0">Danh sách môn học</h5>

            <a th:href="@{/admin/subject}"
               class="btn btn-primary rounded-pill px-4 shadow-sm">
                <i class="bi bi-plus-circle me-2"></i>
                Thêm môn học
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Tên môn học</th>
                            <th>Mô tả</th>
                            <th class="text-end pe-4">Thao tác</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="s: ${subjects}">
                            <td class="ps-4 fw-semibold text-muted" th:text="${s.id}"></td>
                            <td>
                                <div class="fw-semibold" th:text="${s.name}"></div>
                            </td>
                            <td class="text-muted" th:text="${s.description}"></td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/subjects/} + ${s.id}"
                                   class="btn btn-sm btn-outline-primary rounded-pill me-2">
                                    <i class="bi bi-pencil-square me-1"></i>
                                    Sửa
                                </a>

                                <button class="btn btn-sm btn-outline-danger rounded-pill"
                                        th:onclick="'deleteSubject(\'' + @{/api/subjects/} + ${s.id} + '\')'">
                                    <i class="bi bi-trash me-1"></i>
                                    Xoá
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
