<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="h3 fw-bold mb-0">Thêm môn học</h1>
            <a th:href="@{/admin/subjects}" class="btn btn-outline-secondary rounded-pill px-4 shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Quay lại danh sách
            </a>
        </header>

        <div>
            <form method="post" th:object="${subject}" th:action="@{/admin/subject}">
                <div class="mb-3 mt-3">
                    <label for="name" class="form-label">Name: </label>
                    <input type="text" class="form-control" id="name" placeholder="Tên môn học" th:field="*{name}"/>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Description: </label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" placeholder="Miêu tả" th:field="*{description}"></textarea>
                </div>

                <button th:if="${subject.id == null}" class="btn btn-success mb-2">Thêm môn học</button>
                <button th:unless="${subject.id == null}" class="btn btn-success mb-2">Cập nhật môn học</button>

                <input type="hidden" th:field="*{id}" />
            </form>
        </div>
    </main>
</body>
</html>
