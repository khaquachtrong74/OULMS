
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    
    <main class="main-content bg-light min-vh-100 p-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">
                    <i class="bi bi-tags text-primary me-2"></i>
                    Quản lí chủ đề
                </h1>
                <p class="text-muted mb-0">Danh sách các chủ đề trong hệ thống</p>
            </div>

            <div class="d-flex gap-3 align-items-center">
                <form th:action="@{/admin/topics}" method="get" class="position-relative">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text"
                           name="kw"
                           class="form-control ps-5 border-0 bg-white shadow-sm rounded-pill"
                           placeholder="Tìm kiếm chủ đề..."
                           style="width: 300px;">
                </form>

                <button class="btn btn-light shadow-sm rounded-circle">
                    <i class="bi bi-bell fs-5"></i>
                </button>
            </div>
        </header>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-semibold mb-0">Danh sách chủ đề</h5>

            <a th:href="@{/admin/topic}"
               class="btn btn-primary rounded-pill px-4 shadow-sm">
                <i class="bi bi-plus-circle me-2"></i>
                Thêm chủ đề
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Chủ đề</th>
                                <th>Thuộc môn học</th>
                                <th class="text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="t : ${topics}">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center"
                                             style="width: 42px; height: 42px;">
                                            <i class="bi bi-tag fs-5"></i>
                                        </div>

                                        <div>
                                            <div class="fw-semibold" th:text="${t.name}"></div>
                                            <small class="text-muted">
                                                ID: <span th:text="${t.id}"></span>
                                            </small>
                                        </div>
                                    </div>
                                </td>

                                <td>
                                    <span class="badge bg-info-subtle text-info rounded-pill px-3 py-2"
                                          th:text="${t.subjectId.name}">
                                    </span>
                                </td>

                                <td class="text-end pe-4">
                                    <div class="d-flex flex-column align-items-end gap-2">

                                        <a th:href="@{/admin/topics/{id}(id=${t.id})}"
                                           class="btn btn-sm btn-outline-primary rounded-pill d-flex align-items-center justify-content-center gap-2"
                                           style="width: 100px;">
                                            <i class="bi bi-pencil-square"></i>
                                            <span>Sửa</span>
                                        </a>

                                        <button class="btn btn-sm btn-outline-danger rounded-pill d-flex align-items-center justify-content-center gap-2"
                                                style="width: 100px;"
                                                th:onclick="'deleteTopic(\'' + @{/api/topics/} + ${t.id} + '\')'">

                                            <i class="bi bi-trash"></i>
                                            <span>Xoá</span>
                                        </button>

                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(topics)}">
                                <td colspan="3" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    Chưa có chủ đề nào
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
