<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="h3 fw-bold mb-0">Thêm chủ đề</h1>
        </header>
        
        <div>
            <form method="post" th:object="${topic}" th:action="@{/admin/topic}">
                <div class="mb-3 mt-3">
                    <label for="name" class="form-label">Name: </label>
                    <input type="text" class="form-control" id="name" placeholder="Tên môn học" th:field="*{name}"/>
                </div>
                <div class="mb-3 mt-3">
                    <label for="cate" class="form-label">Thuộc môn học: </label>

                    <select class="form-select" name="subjectId" id="sub">
                        <option th:each="s : ${subjects}"
                                th:value="${s.id}"
                                th:text="${s.name}"
                                th:selected="${topic.subjectId != null and topic.subjectId.id == s.id}">
                        </option>
                    </select>
                </div>
                
                <button th:if="${topic.id == null}" class="btn btn-success mb-2">Thêm</button>
                <button th:unless="${topic.id == null}" class="btn btn-success mb-2">Cập nhật</button>

                <input type="hidden" th:field="*{id}" />
            </form>
        </div>
    </main>
</body>
</html>
