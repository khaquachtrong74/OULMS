<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    
    <main class="main-content bg-light min-vh-100 p-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">
                    <i class="bi bi-receipt text-primary me-2"></i>
                    Lịch sử Giao dịch
                </h1>
                <p class="text-muted mb-0">Theo dõi toàn bộ luồng tiền ra vào hệ thống</p>
            </div>
            <div class="d-flex gap-3 align-items-center">
                <form th:action="@{/admin/reports/transactions}" method="get" class="position-relative">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" name="kw" th:value="${param.kw}" class="form-control ps-5 border-0 bg-white shadow-sm rounded-pill" placeholder="Mã giao dịch, Email..." style="width: 300px;">
                </form>
            </div>
        </header>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Mã GD</th>
                                <th>Người dùng</th>
                                <th>Khóa học / Thanh toán</th>
                                <th>Số tiền</th>
                                <th>Trạng thái</th>
                                <th>Thời gian</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${transactions}">
                                <td class="ps-4 fw-semibold text-muted" th:text="'#' + ${t.transactionRef}">#TX101</td>
                                
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-person-circle text-secondary fs-5"></i>
                                        <span class="small" th:text="${t.userId.email}">email@domain.com</span>
                                    </div>
                                </td>
                                
                                <td>
                                    <div class="d-flex flex-column gap-1">
                                        <span class="fw-medium text-dark" th:text="${t.courseId.name}">Tên khóa học</span>
                                        <span class="badge bg-info-subtle text-info rounded-pill px-3 py-1" style="width: fit-content;" th:text="${t.paymentMethod}">ZALOPAY</span>
                                    </div>
                                </td>
                                
                                <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(t.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                
                                <td>
                                    <span th:if="${t.status == 'SUCCESS'}" class="badge bg-success-subtle text-success rounded-pill px-3 py-2">Thành công</span>
                                    <span th:if="${t.status == 'PENDING'}" class="badge bg-warning-subtle text-warning rounded-pill px-3 py-2">Đang chờ</span>
                                    <span th:if="${t.status == 'FAILED'}" class="badge bg-danger-subtle text-danger rounded-pill px-3 py-2">Thất bại</span>
                                </td>
                                
                                <td class="text-muted small" th:text="${#dates.format(t.createdAt, 'HH:mm dd/MM/yyyy')}"></td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(transactions)}">
                                <td colspan="6" class="text-center py-5 text-muted">Không có giao dịch nào</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div> 
            <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center p-4" th:if="${totalPages > 1}">
                <p class="text-muted small mb-0">
                    Trang <span class="fw-semibold" th:text="${currentPage}">1</span> / <span th:text="${totalPages}">1</span>
                </p>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link rounded-circle me-1 d-flex align-items-center justify-content-center" 
                               th:href="@{/admin/reports/transactions(page=${currentPage - 1}, kw=${kw})}" style="width: 32px; height: 32px;">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        
                        <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link rounded-circle me-1 d-flex align-items-center justify-content-center" 
                               th:href="@{/admin/reports/transactions(page=${i}, kw=${kw})}" th:text="${i}" style="width: 32px; height: 32px;">1</a>
                        </li>
                        
                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center" 
                               th:href="@{/admin/reports/transactions(page=${currentPage + 1}, kw=${kw})}" style="width: 32px; height: 32px;">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
