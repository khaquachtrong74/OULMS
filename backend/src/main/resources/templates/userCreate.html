<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="h3 fw-bold mb-0">
                <span th:text="${user.id == null ? 'Thêm người dùng mới' : 'Cập nhật người dùng'}"></span>
            </h1>
        </header>
        
        <div>
            <!-- Chú ý: enctype="multipart/form-data" để có thể đóng gói file upload dạng nhị phân -->
            <form method="post" th:object="${user}" th:action="@{/admin/user}" enctype="multipart/form-data">
                <div class="row mt-3">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">Tên (First Name):</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Nhập tên" th:field="*{firstName}" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Họ (Last Name):</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Nhập họ" th:field="*{lastName}" required />
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="example@edudocs.vn" th:field="*{email}" required />
                </div>
                
                <!-- Chỉ hiển thị ô nhập mật khẩu khi tạo mới (id == null) -->
                <div class="mb-3" th:if="${user.id == null}">
                    <label for="password" class="form-label">Mật khẩu:</label>
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" th:field="*{password}" required />
                </div>
                
                <div class="mb-3">
                    <label for="role" class="form-label">Vai trò (Role):</label>
                    <select class="form-select" id="role" th:field="*{role}">
                        <option value="STUDENT">STUDENT</option>
                        <option value="LECTURER">LECTURER</option>
                    </select>
                </div>
                
                <!-- Input file không map trực tiếp vào Entity User mà đẩy lên qua request parameter -->
                <div class="mb-4">
                    <label for="avatar" class="form-label">Ảnh đại diện (Avatar):</label>
                    <input type="file" class="form-control" id="file" name="avatar" accept="image/png, image/jpeg, image/jpg" />
                </div>
                
                <button th:if="${user.id == null}" class="btn btn-primary mb-2 px-4 rounded-pill shadow-sm">
                    <i class="bi bi-person-plus me-2"></i>Thêm người dùng
                </button>
                <button th:unless="${user.id == null}" class="btn btn-primary mb-2 px-4 rounded-pill shadow-sm">
                    <i class="bi bi-save me-2"></i>Lưu thay đổi
                </button>
                
                <!-- Trường ẩn giữ ID để Spring biết đây là thao tác Update thay vì Insert -->
                <input type="hidden" th:field="*{id}" />
            </form>
        </div>
    </main>
</body>
</html>
