<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="index :: head"></th:block>
</head>
<body>
    <aside>
        <th:block th:replace="index :: sidebar"></th:block>
    </aside>
    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="h3 fw-bold mb-0">Cập nhật người dùng</h1>
        </header>
        
        <div>
            <form method="post" th:object="${user}" th:action="@{/admin/users/{id}(id=${user.id})}" enctype="multipart/form-data">
                <div class="row mt-3">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label">Tên (First Name):</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Nhập tên" th:field="*{firstName}" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label">Họ (Last Name):</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Nhập họ" th:field="*{lastName}" required />
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required readonly style="background-color: #e9ecef;" />
                </div>
                
                <div class="mb-3">
                    <label for="role" class="form-label">Vai trò (Role):</label>
                    <select class="form-select" id="role" th:field="*{role}">
                        <option value="STUDENT">STUDENT</option>
                        <option value="LECTURER">LECTURER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label for="avatar" class="form-label">Ảnh đại diện (Avatar) - Để trống nếu không thay đổi:</label>
                    <input type="file" class="form-control" id="file" name="avatar" accept="image/png, image/jpeg, image/jpg" />
                </div>
                
                <button type="submit" class="btn btn-primary mb-2 px-4 rounded-pill shadow-sm">
                    <i class="bi bi-save me-2"></i>Lưu thay đổi
                </button>
                <a th:href="@{/admin/users}" class="btn btn-secondary mb-2 px-4 rounded-pill shadow-sm ms-2">
                    Hủy
                </a>
                
                <input type="hidden" th:field="*{id}" />
            </form>
        </div>
    </main>
</body>
</html>
